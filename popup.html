<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Translator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="popup-header">
            <h1>🌐 Ultimate Translator</h1>
            <p class="subtitle">无敌翻译器</p>
        </div>

        <div class="popup-body">
            <button class="feature-btn" id="web-translate-btn">
                <div class="btn-icon">🌍</div>
                <div class="btn-content">
                    <div class="btn-title">Webpage Translation</div>
                    <div class="btn-desc">网页翻译</div>
                </div>
            </button>

            <button class="feature-btn" id="excel-translate-btn">
                <div class="btn-icon">📊</div>
                <div class="btn-content">
                    <div class="btn-title">Excel Translation</div>
                    <div class="btn-desc">Excel文件翻译</div>
                </div>
            </button>
        </div>

        <div class="popup-footer">
            <p class="version">v1.3.0</p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
